<div class="flex min-h-[80vh] items-center justify-center bg-gray-100 px-4">

  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">

    <div class="mb-8 text-center">

      <div
        class="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full bg-blue-100 text-4xl">

        🔐

      </div>

      <h2 class="text-3xl font-bold text-blue-700">

        Welcome Back

      </h2>

      <p class="mt-2 text-gray-500">

        Login to your Skill Exchange account

      </p>

    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()">

      <!-- Email -->

      <div class="mb-5">

        <label class="mb-2 block font-semibold text-gray-700">

          Email Address

        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-full rounded-xl border border-gray-300 p-3 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200">

      </div>

      <!-- Password -->

      <div class="mb-4">

        <label class="mb-2 block font-semibold text-gray-700">

          Password

        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full rounded-xl border border-gray-300 p-3 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200">

      </div>

      @if(errorMessage()){

      <div
        class="mb-4 rounded-lg border border-red-300 bg-red-100 p-3 text-center text-red-700">

        {{errorMessage()}}

      </div>

      }

      <button
        type="submit"
        class="w-full rounded-xl bg-blue-600 py-3 text-lg font-bold text-white transition duration-300 hover:bg-blue-700 hover:shadow-lg">

        Login

      </button>

    </form>

    <div class="mt-6 text-center text-gray-600">

      Don't have an account?

      <a
        routerLink="/register"
        class="font-semibold text-blue-600 hover:underline">

        Register

      </a>

    </div>

  </div>

</div>
